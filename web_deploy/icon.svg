<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="512" height="512" rx="120" fill="url(#bgGrad)" stroke="#10B981" stroke-width="8"/>
  <circle cx="256" cy="256" r="200" fill="#162032" stroke="#059669" stroke-width="4"/>
  <text x="256" y="270" font-size="200" text-anchor="middle" dominant-baseline="middle">🍓</text>
  <text x="256" y="420" font-family="-apple-system, BlinkMacSystemFont, 'Pretendard', sans-serif" font-weight="900" font-size="40" fill="#34D399" text-anchor="middle" letter-spacing="2">누리오 스마트팜</text>
</svg>
