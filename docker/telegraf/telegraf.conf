[agent_logging]
  quiet = false
  
[[inputs.mqtt_consumer]]
  ## MQTT 브로커 연결 설정
  servers = ["tcp://${MQTT_HOST}:${MQTT_PORT}"]
  
  ## 인증 (HiveMQ Cloud의 경우 TLS)
  # servers = ["ssl://${MQTT_HOST}:${MQTT_PORT}"]
  username = "${MQTT_USERNAME}"
  password = "${MQTT_PASSWORD}"
  
  ## 구독할 토픽 목록 (와일드카드 사용)
  topics = [
    "farm/+/house/+/sensor/#",
    "farm/+/house/+/status",
    "farm/+/ess/status",
    "farm/+/weather/outdoor",
  ]
  
  ## QoS 레벨 (1 = at least once)
  qos = 1
  
  ## 데이터 포맷
  data_format = "json"
  
  ## JSON 타임스탬프 필드
  json_time_key = "timestamp"
  json_time_format = "2006-01-02T15:04:05Z07:00"
  
  ## 태그로 추출할 필드 (InfluxDB 인덱싱용)
  json_string_fields = ["sensor_id", "device_id"]
  
  ## MQTT 토픽에서 태그 추출
  ## 예: farm/cheongjeong/house/h01/sensor/environment/env_001
  ## → farm_id=cheongjeong, house_id=h01, sensor_type=environment
  topic_tag = "full_topic"

[[processors.regex]]
  ## MQTT 토픽에서 farm_id, house_id 추출
  [[processors.regex.tags]]
    key = "full_topic"
    pattern = "^farm/([^/]+)/house/([^/]+)/.*"
    replacement = "${1}"
    result_key = "farm_id"
  
  [[processors.regex.tags]]
    key = "full_topic"
    pattern = "^farm/[^/]+/house/([^/]+)/.*"
    replacement = "${1}"
    result_key = "house_id"

[[outputs.influxdb_v2]]
  ## InfluxDB 2.x 설정
  urls = ["${INFLUXDB_URL}"]
  token = "${INFLUXDB_TOKEN}"
  organization = "smartfarm"
  bucket = "greenhouse_telemetry"
  
  ## 태그키 목록
  tagexclude = ["full_topic"]
  
  ## 쓰기 타임아웃
  timeout = "5s"

